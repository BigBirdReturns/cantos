name: Compute source and browser qualification
on:
  pull_request:
    paths: ['compute/**', '.github/workflows/compute-ci.yml']
  push:
    paths: ['compute/**', '.github/workflows/compute-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Source, arithmetic, MCP and HTTP controls
        run: |
          node --test compute/tests/test_core.cjs compute/tests/test_bridge.cjs
          python -m unittest discover -s compute/tests -p 'test_prices.py' -v
      - name: Rebuild page and archive from source
        run: python compute/scripts/build.py
      - name: Install browser test tooling only
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Exercise native browser connection and exports
        run: python compute/tests/test_browser.py --require-navigation --out "$RUNNER_TEMP/compute-qa"
      - name: Attach exact release and review output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compute-${{ github.sha }}
          path: |
            compute/index.html
            compute/compute-kit.zip
            compute/MANIFEST.json
            ${{ runner.temp }}/compute-qa
