# Optional maintainer job. Install under .github/workflows after selecting the review cadence.
# Fetches four public pricing pages. It never rewrites catalog prices or their review date.
name: Compute price-source review
on:
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python compute/scripts/review_prices.py --fetch --out "$RUNNER_TEMP/price-review.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: price-review-${{ github.run_id }}
          path: ${{ runner.temp }}/price-review.json
