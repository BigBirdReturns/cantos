name: The shelf
on:
  push:
    paths: ['shelf/**', 'hot-aisle/campaign/shelf/cards.jsonl', '.github/workflows/shelf-ci.yml']
  pull_request:
    paths: ['shelf/**', 'hot-aisle/campaign/shelf/cards.jsonl', '.github/workflows/shelf-ci.yml']
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  verify:
    name: Filing check, composition refusals, engine parity, no drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHON: python3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Shelf copy matches the retained campaign record
        run: python3 -B shelf/scripts/shelf.py sync --check
      - name: Every card on the shelf passes the filing check
        run: python3 -B shelf/scripts/shelf.py validate shelf/data/cards.jsonl
      - name: Staged imports carry provenance and were never promoted silently
        run: python3 -B shelf/scripts/check_staging.py
      - name: CLI regressions
        run: python3 -B -m unittest discover -s shelf/tests -p 'test_shelf.py' -v
      - name: Browser engine agrees with the CLI on the shared fixture
        run: node --test shelf/tests/test_engine.cjs
      - name: Forge, small scale: generated population through both engines, every invariant
        run: |
          set -euo pipefail
          python3 -B shelf/scripts/forge.py --scale small --seed 1
          python3 -B -m unittest discover -s shelf/tests -p 'test_forge.py' -v
      - name: Generated rule boundaries, streaming parity and custody regressions
        run: |
          set -euo pipefail
          python3 -B shelf/tests/generated.py --profile ci --seed 20260924 --out "$RUNNER_TEMP/shelf-generated"
          python3 -B -m unittest discover -s shelf/tests -p 'test_generated_*.py' -v
          python3 -B -m unittest discover -s shelf/tests -p 'test_federation_properties.py' -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shelf-generated-${{ github.run_id }}
          path: ${{ runner.temp }}/shelf-generated/
          if-no-files-found: warn
      - name: No scratch files left in the tool
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain -- shelf)"
          ! find shelf -name '__pycache__' -o -name '*.pyc' | grep .
