name: Compute desk and workload instrument
on:
  push:
    paths: ['hot-aisle/**', 'compute/**', 'integration/**', '.gitattributes', '.github/workflows/pta-fetch.yml', '.github/workflows/organ-evolution-observe.yml', '.github/workflows/axm-witness-0.9.2.yml', '.github/workflows/axm-witness-live-readback-0.9.2.yml', '.github/workflows/hot-aisle-ci.yml']
  pull_request:
    paths: ['hot-aisle/**', 'compute/**', 'integration/**', '.gitattributes', '.github/workflows/pta-fetch.yml', '.github/workflows/organ-evolution-observe.yml', '.github/workflows/axm-witness-0.9.2.yml', '.github/workflows/axm-witness-live-readback-0.9.2.yml', '.github/workflows/hot-aisle-ci.yml']
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  verify:
    name: Authorities, software, native browsers, reproducible kits
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generated authority copies match their sources
        run: python integration/build.py --check
      - name: Measured-result engine and scenario engines
        run: |
          set -euo pipefail
          node hot-aisle/scripts/test_workbench.cjs | tee instrument-engine.log
          node --test hot-aisle/runner/test/*.test.cjs compute/tests/test_core.cjs compute/tests/test_bridge.cjs integration/tests/seam.test.cjs compute/community/tests/test_core.cjs | tee software-tests.log
          python -m unittest discover -s hot-aisle/scripts -p 'test_price_math.py' -v
          python -m unittest discover -s compute/tests -p 'test_prices.py' -v
          python -m unittest discover -s integration/tests -p 'test_release_gate.py' -v
          python -m unittest discover -s integration/tests -p 'test_task_*.py' -v
          python -m unittest discover -s integration/tests -p 'test_work.py' -v
      - name: Source-driven kits are reproducible
        run: |
          set -euo pipefail
          python compute/scripts/build.py
          node compute/community/build.cjs
          python hot-aisle/scripts/build_kit.py --check
          git diff --exit-code -- compute/index.html compute/MANIFEST.json compute/compute-kit.zip compute/results.html compute/community-kit.zip compute/community
      - name: Install exact browser test dependency
        id: browser_setup
        run: |
          npm install --no-save --prefix /tmp/compute-browser playwright@1.58.0
          python -m pip install playwright==1.58.0
          /tmp/compute-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Instrument native browser, SSE and reconnect journeys
        if: ${{ !cancelled() && steps.browser_setup.outcome == 'success' }}
        env:
          PLAYWRIGHT_MODULE: file:///tmp/compute-browser/node_modules/playwright/index.mjs
        run: |
          set -euo pipefail
          node hot-aisle/scripts/verify_page.mjs | tee instrument-journeys.json
      - name: Desk native browser journeys, with no set_content substitution
        if: ${{ !cancelled() && steps.browser_setup.outcome == 'success' }}
        run: python compute/tests/test_browser.py --require-navigation --out compute-browser-qa
      - name: Two-service qualification-to-decision journey
        if: ${{ !cancelled() && steps.browser_setup.outcome == 'success' }}
        env:
          NODE_PATH: /tmp/compute-browser/node_modules
          SEAM_QA_DIR: seam-browser-qa
        run: node integration/tests/browser.cjs
      - name: Fresh visitor completes and retains a result
        if: ${{ !cancelled() && steps.browser_setup.outcome == 'success' }}
        env:
          PLAYWRIGHT_MODULE: file:///tmp/compute-browser/node_modules/playwright/index.mjs
        run: node integration/tests/newcomer.mjs
      - name: Community claims, contributions and independent hub journey
        if: ${{ !cancelled() && steps.browser_setup.outcome == 'success' }}
        env:
          NODE_PATH: /tmp/compute-browser/node_modules
        run: node compute/community/tests/browser.cjs
      - name: Capture exact tested-source identity
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          paths=['compute/index.html','hot-aisle/index.html','compute/data/catalog.json','hot-aisle/data/catalog.json','compute/compute-kit.zip','hot-aisle/workload-report.zip','compute/results.html','compute/community-kit.zip','compute/community/MANIFEST.json']
          record={'source_commit':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],'files':{p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in paths if Path(p).exists()},'scope':'Software and native local-service tests with authored fixtures, retained source-bound campaign projections, and independent-hub origin-loss tests. No new provider account access, GPU measurement, or outside adoption is asserted.'}
          Path('integration-ci-identity.json').write_text(json.dumps(record,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compute-seam-${{ github.run_id }}
          path: |
            instrument-engine.log
            software-tests.log
            instrument-journeys.json
            instrument-browser-qa/
            integration-ci-identity.json
            compute-browser-qa/
            seam-browser-qa/
            newcomer-qa/
            community-browser-qa/
            compute/community-kit.zip
            compute/compute-kit.zip
            hot-aisle/workload-report.zip
          if-no-files-found: error
